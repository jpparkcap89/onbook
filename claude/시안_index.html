<html lang="ko">

   PICTURE: 히어로 오른쪽에 세 권의 책 일러스트(SVG), 책 화면에서는 차시 카드와 A4 활동지 미리보기
   COLOUR and TYPE: cap89 스타일 — 파스텔 블롭 배경, 유리 카드, 블루 프라이머리, 책마다 앰버·민트·핑크 / Pretendard
   LAYOUT: 홈(히어로+책 3권) → 책(소개+10차시 그리드) → 차시(활동 안내+활동지), 해시 라우팅 */
:root{--ink:#24324a;--muted:#667085;--primary:#3b63f6;--primary-hover:#254ed8;--sky:#38bdf8;--accent:#ffcf70;--secondary:#7fd8c9;--pink:#ff9fb5;
--panel:rgba(255,255,255,.72);--panel-line:rgba(255,255,255,.95);--hairline:rgba(36,50,74,.07);--shadow:0 20px 60px rgba(67,89,146,.16);--shadow-sm:0 8px 24px rgba(50,68,110,.08);
--font:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;font-family:var(--font);color:var(--ink);font-size:16px;line-height:1.7;overflow-x:clip;
background:radial-gradient(circle at 12% 18%,rgba(255,207,112,.45),transparent 28%),radial-gradient(circle at 88% 14%,rgba(127,216,201,.45),transparent 30%),radial-gradient(circle at 75% 82%,rgba(255,159,181,.28),transparent 28%),linear-gradient(135deg,#f8fbff 0%,#fffdf7 45%,#f8fffc 100%);background-attachment:fixed;min-height:100vh}
a{color:var(--primary)}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
header{padding:18px 0}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:800;font-size:17px}
.mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#3b63f6,#8e9cff);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:800;box-shadow:0 10px 25px rgba(59,99,246,.28)}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav a{color:var(--ink);text-decoration:none;font-size:15px;font-weight:650;padding:8px 12px;border-radius:999px}
nav a.on{color:var(--primary);background:rgba(59,99,246,.1)}
.pill{display:inline-block;border-radius:999px;padding:8px 15px;background:rgba(255,255,255,.78);backdrop-filter:blur(10px);border:1px solid rgba(59,99,246,.14);color:var(--primary);font-size:14px;font-weight:750;box-shadow:var(--shadow-sm)}
h1{font-size:clamp(27px,4.4vw,44px);font-weight:850;letter-spacing:-.028em;line-height:1.2;margin:16px 0 14px;text-wrap:balance}
.grad{background:linear-gradient(100deg,#3b63f6 0%,#38bdf8 52%,#f59e0b 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:24px;font-weight:750;letter-spacing:-.02em;margin:0 0 6px}
h3{font-size:19px;font-weight:700;margin:0 0 4px}
.eb{font-size:13px;font-weight:750;color:var(--primary);letter-spacing:.04em}
.lead{color:var(--muted);font-size:17px;max-width:60ch}
.glass{background:var(--panel);backdrop-filter:blur(20px);border:1px solid var(--panel-line);border-radius:30px;padding:clamp(18px,3vw,28px);box-shadow:var(--shadow)}
section{padding:28px 0 70px;animation:pageIn .5s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:28px;align-items:center}
.shelf{min-height:300px}
.shelf svg{width:100%;height:auto;display:block}
.float{animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translate(6px,-12px)}}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.stat{background:rgba(255,255,255,.78);border:1px solid var(--hairline);border-radius:16px;padding:10px 16px}
.stat b{font-size:22px;display:block;line-height:1.2}.stat span{font-size:13px;color:var(--muted)}
.books{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:30px}
.book{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink);transition:.2s}
.book:hover{transform:translateY(-4px)}
.cov{border-radius:20px;height:150px;display:flex;align-items:flex-end;padding:16px;position:relative;overflow:hidden}
.cov .em{position:absolute;right:14px;top:10px;font-size:58px}
.cov .gr{background:rgba(255,255,255,.85);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:750}
.book p{margin:0;color:var(--muted);font-size:15px}
.meta{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:10px 18px;border-radius:999px;border:0;background:var(--primary);color:#fff;font:650 15px var(--font);cursor:pointer;text-decoration:none}
.btn:hover{background:var(--primary-hover)}
.btn.sec{background:rgba(255,255,255,.85);color:var(--primary);border:1px solid rgba(59,99,246,.18)}
.btn:focus-visible,a:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.bhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:start}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0;list-style:none}
.chips li{font-size:13px;background:rgba(255,255,255,.8);border:1px solid var(--hairline);border-radius:999px;padding:3px 11px}
.phase{margin-top:26px}
.phase h3{display:flex;align-items:center;gap:8px}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:12px}
.ls{background:rgba(255,255,255,.8);border:1px solid var(--hairline);border-radius:18px;padding:16px;text-decoration:none;color:var(--ink);transition:.2s;display:flex;flex-direction:column;gap:4px}
.ls:hover{transform:translateY(-3px);box-shadow:var(--shadow-sm)}
.ls .n{font-size:13px;font-weight:750;color:var(--primary)}
.ls b{font-size:17px;line-height:1.35}
.ls span{font-size:14px;color:var(--muted)}
.lgrid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:22px;align-items:start}
.steps{padding-left:1.3em;margin:8px 0 0}.steps li{margin-bottom:8px}
.box{background:rgba(255,255,255,.75);border-radius:16px;padding:14px 16px;border:1px solid var(--hairline);margin-top:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
/* 활동지 */
.sheet{background:#fff;color:#1d2433;border-radius:6px;padding:34px 36px;box-shadow:var(--shadow);font-size:15px;line-height:1.6;aspect-ratio:auto}
.sheet .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:2px solid #1d2433;padding-bottom:10px;margin-bottom:14px;flex-wrap:wrap}
.sheet .tt{font-size:21px;font-weight:800;line-height:1.3}
.sheet .sub{font-size:13px;color:#555}
.sheet .who{display:flex;gap:10px;font-size:13px;flex-wrap:wrap}
.sheet .who span{border-bottom:1px solid #999;padding:0 26px 0 0;white-space:nowrap}
.sheet .goal{background:#f3f6ff;border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:14px}
.it{margin-bottom:16px;break-inside:avoid}
.it .q{font-weight:700;margin-bottom:6px}
.lines div{border-bottom:1px dashed #b8bfcc;height:30px}
.draw{border:1.5px solid #b8bfcc;border-radius:10px;height:190px}
.sheet table{width:100%;border-collapse:collapse;font-size:14px}
.sheet th,.sheet td{border:1px solid #b8bfcc;padding:6px;height:40px;text-align:center;vertical-align:middle}
.sheet th{background:#f3f6ff;height:auto}
.ck{display:flex;flex-wrap:wrap;gap:8px 18px}
.ck span::before{content:"☐ ";font-size:17px}
.sheet .foot{font-size:12px;color:#888;text-align:right;margin-top:6px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:30px 0 40px}
#printArea{display:none}
@media(max-width:1024px){.hero,.lgrid{grid-template-columns:1fr}.books{grid-template-columns:1fr}.shelf{min-height:0;max-width:440px}}
@media(max-width:520px){.sheet{padding:20px 16px}.bhead{grid-template-columns:1fr}.glass{border-radius:24px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff}
  header,footer,main{display:none!important}
  #printArea{display:block!important}
  .sheet{box-shadow:none;border-radius:0;padding:0;page-break-after:always;font-size:14px}
  .sheet:last-child{page-break-after:auto}
  @page{size:A4;margin:16mm 15mm}
}
</style>
</head>

const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function item(it,i){
  const [k,q]=it,h=`<div class="q">${i+1}. ${esc(q)}</div>`;
  if(k==='q')return `<div class="it">${h}<div class="lines">${'<div></div>'.repeat(it[2])}</div></div>`;
  if(k==='draw')return `<div class="it">${h}<div class="draw"></div></div>`;
  if(k==='ck')return `<div class="it">${h}<div class="ck">${it[2].map(o=>`<span>${esc(o)}</span>`).join('')}</div></div>`;
  if(k==='tbl'){const cols=it[2],rl=it[4]||[];
    return `<div class="it">${h}<table><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${Array.from({length:it[3]},(_,r)=>`<tr>${cols.map((c,j)=>j===0&&rl[r]?`<th>${esc(rl[r])}</th>`:'<td></td>').join('')}</tr>`).join('')}</table></div>`}
  return '';
}
function sheet(b,l,n){

}

  const c=[['#ffcf70','#f2b441'],['#7fd8c9','#4fbfac'],['#ff9fb5','#f07d98']];
  return `<svg viewBox="0 0 420 320" role="img" aria-label="책꽂이에 꽂힌 세 권의 책">
  <defs><linearGradient id="sh" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#e8eefc"/></linearGradient></defs>
  <ellipse cx="210" cy="292" rx="180" ry="16" fill="#3b63f6" opacity=".08"/>
  <rect x="30" y="262" width="360" height="22" rx="11" fill="url(#sh)" stroke="#dbe3fb"/>
  ${c.map(([a,d],i)=>{const x=70+i*100,h=180+i*14,y=262-h;return `<g class="float" style="animation-delay:${i*-2}s">
   <rect x="${x}" y="${y}" width="82" height="${h}" rx="10" fill="${a}"/><rect x="${x}" y="${y}" width="16" height="${h}" rx="8" fill="${d}"/>
   <rect x="${x+26}" y="${y+24}" width="42" height="6" rx="3" fill="#fff" opacity=".85"/><rect x="${x+26}" y="${y+36}" width="30" height="6" rx="3" fill="#fff" opacity=".6"/>
   <circle cx="${x+48}" cy="${y+h-46}" r="18" fill="#fff" opacity=".55"/></g>`}).join('')}
  <path d="M352 60c10 0 16 8 16 16 0-8 6-16 16-16-10 0-16-8-16-16 0 8-6 16-16 16z" fill="#3b63f6" opacity=".55"/>
  <path d="M40 90c7 0 11 5 11 11 0-6 4-11 11-11-7 0-11-5-11-11 0 6-4 11-11 11z" fill="#f59e0b" opacity=".6"/></svg>`;
}
function home(){
  nav('home');
  $('#app').innerHTML=`<section>
  <div class="hero"><div>
    <span class="pill">✨ 박선영 작가 한 책 읽기</span>
    <h1>책 한 권을 깊이 읽고<br><span class="grad">함께 생각을 키워요</span></h1>
    <p class="lead">학년군별로 고른 <strong>박선영 작가의 동화 세 권</strong>을 읽기 전·중·후 <strong>10차시 활동</strong>으로 나누었습니다. 책을 고르면 차시별 수업 흐름과 <strong>인쇄용 활동지</strong>를 바로 볼 수 있습니다.</p>
    <div class="stats"><div class="stat"><b>3권</b><span>학년군별 도서</span></div><div class="stat"><b>30차시</b><span>학생 활동</span></div><div class="stat"><b>30장</b><span>활동지</span></div></div>
  </div><div class="shelf">${shelfSVG()}</div></div>
  <div class="eb" style="margin-top:34px">BOOKS</div><h2>📚 우리 학년 책 고르기</h2>
  <div class="books">${BOOKS.map(b=>`<a class="book glass" href="#${b.id}">
    <div class="cov" style="background:${b.color}"><span class="em" aria-hidden="true">${b.em}</span><span class="gr">${b.grade}</span></div>
    <h3>${esc(b.title)}</h3><div class="meta">${esc(b.info)}</div><p>${esc(b.theme)}</p>
    <span class="btn sec" style="align-self:flex-start">10차시 활동 보기 →</span></a>`).join('')}</div>
  </section>`;
}
function bookView(b){
  nav(b.id);
  $('#app').innerHTML=`<section><div class="glass">
   <div class="bhead"><div><span class="pill">${b.em} ${b.grade}</span><h1 style="font-size:clamp(26px,3.6vw,38px)">${esc(b.title)}</h1>
    <div class="meta">${esc(b.info)}</div><p class="lead" style="margin:10px 0 0">${esc(b.sum)}</p>
    <ul class="chips">${b.ch.map((c,i)=>`<li>${b.id==='suii'&&i===0?'':((b.id==='suii'?i:i+1)+'. ')}${esc(c)}</li>`).join('')}</ul></div>
    <div><button class="btn" id="printAll">🖨️ 활동지 10장 한번에 인쇄</button></div></div>
   ${PH.map((ph,pi)=>{const ls=b.L.map((l,i)=>({l,i})).filter(o=>o.l.p===pi);return `<div class="phase"><h3>${ph[0]} ${ph[1]}</h3><div class="lessons">
     ${ls.map(({l,i})=>`<a class="ls" href="#${b.id}-${i+1}"><span class="n">${i+1}차시 · ${esc(l.c)}</span><b>${esc(l.t)}</b><span>${esc(l.g)}</span></a>`).join('')}</div></div>`}).join('')}
   <p class="note" id="pmsg">차시별 활동은 목차와 책 소개를 바탕으로 만든 예시 계획입니다. 실제 책 내용과 학급 상황에 맞게 다듬어 사용해 주세요.</p>
  </div></section>`;
  $('#printAll').onclick=()=>doPrint(b.L.map((l,i)=>sheet(b,l,i+1)).join(''),'#pmsg');
}
function lessonView(b,n){
  nav(b.id);const l=b.L[n-1];
  $('#app').innerHTML=`<section>
  <a href="#${b.id}" class="btn sec" style="margin-bottom:16px">← ${esc(b.title)}</a>
  <div class="lgrid"><div class="glass">
    <span class="pill">${PH[l.p][0]} ${PH[l.p][1]} · ${n}차시</span>
    <h1 style="font-size:clamp(24px,3vw,32px)">${esc(l.t)}</h1>
    <div class="meta">${esc(b.title)} · ${esc(l.c)} · 40분</div>
    <div class="box"><b>🎯 학습 목표</b><br>${esc(l.g)}</div>
    <div class="box"><b>🧭 활동 흐름</b><ol class="steps">${l.s.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>
    <div class="box"><b>📝 활동지 문항</b><ol class="steps">${l.w.map(w=>`<li>${esc(w[1])}</li>`).join('')}</ol></div>
    <div class="pager">${n>1?`<a class="btn sec" href="#${b.id}-${n-1}">← ${n-1}차시</a>`:'<span></span>'}${n<10?`<a class="btn" href="#${b.id}-${n+1}">${n+1}차시 →</a>`:''}</div>
  </div><div>
    <div class="tools"><button class="btn" id="pr">🖨️ 인쇄 / PDF 저장</button><button class="btn sec" id="cp">📋 문항 텍스트 복사</button></div>
    <p class="note" id="msg" aria-live="polite"></p>
    ${sheet(b,l,n)}
  </div></div></section>`;
  $('#pr').onclick=()=>doPrint(sheet(b,l,n),'#msg');
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(sheetText(b,l,n));$('#msg').textContent='복사했어요. 구글 문서나 클래스룸 과제에 붙여 넣으세요.'}catch(e){$('#msg').textContent='복사가 막혀 있어요. 활동지 문항을 직접 선택해 복사해 주세요.'}};
}
function doPrint(html,msgSel){
  $('#printArea').innerHTML=html;
  try{window.print()}catch(e){}
  const m=$(msgSel);if(m)m.textContent='인쇄 창이 열리지 않으면 이 페이지를 새 창(또는 웹 주소)에서 열어 주세요. 미리보기 창에서는 인쇄가 막힐 수 있습니다.';
}
function route(){
  const h=location.hash.slice(1),[id,n]=h.split('-'),b=BOOKS.find(x=>x.id===id);
  if(b&&n&&+n>=1&&+n<=10)lessonView(b,+n);else if(b)bookView(b);else home();
  window.scrollTo(0,0);
}
addEventListener('hashchange',route);route();
}
</script>
</body>
</html>
